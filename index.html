<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Diwali Celebration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #2b0b47 0%, #0c0217 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      position: relative;
    }

    /* Background Canvas */
    #fireworksCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* Top Navigation HUD */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 20;
    }
    .badge-name {
      background: linear-gradient(135deg, #ff9933, #d32f2f);
      border: 2px solid #ffd700;
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 153, 51, 0.6);
      letter-spacing: 0.5px;
    }
    .btn-wishes {
      background: #ffd700;
      color: #1a0026;
      border: none;
      padding: 9px 18px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.1s;
    }
    .btn-wishes:active { transform: scale(0.95); }

    /* Interactive Bottom Playground */
    .bottom-ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 160px;
      background: linear-gradient(to top, rgba(15, 2, 25, 0.95), transparent);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 25px;
      pointer-events: none;
    }
    .instruction-text {
      font-size: 13px;
      color: #ffd700;
      margin-bottom: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    .diya-row {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    .diya-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid #ff9933;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 24px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .diya-btn.lit {
      border-color: #ffd700;
      background: radial-gradient(circle, #ffeedd 0%, #ff9933 70%);
      box-shadow: 0 0 20px #ff9933, 0 0 40px #ffd700;
      transform: scale(1.1);
    }
    .diya-flame {
      position: absolute;
      top: -12px;
      font-size: 16px;
      display: none;
    }
    .diya-btn.lit .diya-flame { display: block; animation: flicker 0.2s infinite alternate; }
    @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }

    /* Modal / Wishes Popup */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(6px);
    }
    .modal-card {
      background: linear-gradient(180deg, #2b0b47 0%, #150220 100%);
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    }
    .modal-card h2 { color: #ffd700; font-size: 22px; margin-bottom: 6px; }
    .modal-card .subtitle { color: #ff9933; font-size: 13px; font-weight: bold; margin-bottom: 14px; }
    
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #12031d;
      color: #ffd700;
      border: 1px solid #ffd700;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
    }
    .msg-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #fff;
      text-align: left;
      white-space: pre-line;
      margin-bottom: 14px;
      border-left: 3px solid #ff9933;
    }
    .from-tag {
      color: #ffd700;
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 18px;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-wa {
      background: #25D366;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-native {
      background: #e91e63;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-close {
      width: 100%;
      background: transparent;
      border: 1px solid #777;
      color: #bbb;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="top-bar">
    <div class="badge-name">🪔 Rushikesha & Family</div>
    <button class="btn-wishes" onclick="toggleModal(true)">View Wishes 📜</button>
  </div>

  <!-- Interactive Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Interactive Bottom Controls (Diyas to tap) -->
  <div class="bottom-ground">
    <div class="instruction-text">✨ Tap the Diyas to light them, or tap the sky for Fireworks! ✨</div>
    <div class="diya-row">
      <div class="diya-btn" onclick="lightDiya(this, event)">
        <span class="diya-flame">🔥</span>
        🪔
      </div>
      <div class="diya-btn" onclick="lightDiya(this, event)">
        <span class="diya-flame">🔥</span>
        🪔
      </div>
      <div class="diya-btn" onclick="lightDiya(this, event)">
        <span class="diya-flame">🔥</span>
        🪔
      </div>
      <div class="diya-btn" onclick="lightDiya(this, event)">
        <span class="diya-flame">🔥</span>
        🪔
      </div>
      <div class="diya-btn" onclick="lightDiya(this, event)">
        <span class="diya-flame">🔥</span>
        🪔
      </div>
    </div>
  </div>

  <!-- Greeting Card Modal (Hidden by Default) -->
  <div id="wishModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Happy Diwali! 🪔</h2>
      <div class="subtitle">Chhatrapati Shivaji Maharaj Inspired Wishes</div>

      <label for="langSelect" style="display:block; text-align:left; font-size:12px; margin-bottom:4px; color:#aaa;">Choose Language:</label>
      <select id="langSelect" onchange="updateMessage()">
        <option value="marathi">मराठी (Marathi)</option>
        <option value="english">English</option>
        <option value="tamil">தமிழ் (Tamil)</option>
        <option value="telugu">తెలుగు (Telugu)</option>
        <option value="punjabi">ਪੰਜਾਬੀ (Punjabi)</option>
      </select>

      <div id="messageText" class="msg-box"></div>

      <div class="from-tag">— Wishes from Rushikesha & Family 🚩</div>

      <div class="actions-grid">
        <button class="btn-wa" onclick="shareWhatsApp()">Share WhatsApp 📲</button>
        <button class="btn-native" onclick="shareNative()">Share Link 🔗</button>
      </div>
      <button class="btn-close" onclick="toggleModal(false)">Close & Continue Playing</button>
    </div>
  </div>

  <script>
    const messages = {
      marathi: `अंधारावर प्रकाशाचा विजय साजरा करण्याचा हा दीपोत्सव! 🪔\n\nज्याप्रमाणे छत्रपती शिवाजी महाराजांनी स्वराज्याची ज्योत पेटवली, त्याचप्रमाणे तुमच्या मनात धैर्य, जिद्द आणि प्रेरणेचा दिवा सदैव तेवत राहो.\n\nया दिवाळीत तुमच्या आयुष्यात सुख, समृद्धी आणि यशाचा प्रकाश उजळो!\n\nदिवाळीच्या हार्दिक शुभेच्छा! जय भवानी, जय शिवराय! 🚩`,
      english: `Happy Diwali! 🪔\n\nJust as Chhatrapati Shivaji Maharaj lit the flame of Swarajya in the darkest of times, may this Diwali ignite courage, vision, and purpose in your heart.\n\nHe showed us that greatness comes from discipline, justice, and the will to build something larger than oneself. May your home glow with happiness and your spirit stay unbreakable!\n\nShubh Deepavali! Jai Bhavani, Jai Shivaji! 🚩`,
      tamil: `இருளை வென்று ஒளி பிறக்கும் தீபத் திருநாள்! 🪔\n\nசத்ரபதி சிவாஜி மகாராஜ் சுயராஜ்ஜியத்தின் தீபத்தை ஏற்றியது போல, உங்கள் மனதில் துணிவு, உறுதி, உத்வேகம் என்னும் தீபம் எப்போதும் ஒளிரட்டும்.\n\nஇந்தத் தீபாவளி உங்கள் வாழ்வில் மகிழ்ச்சி, செழிப்பு, வெற்றியின் ஒளியைப் பரப்பட்டும்!\n\nதீபாவளி நல்வாழ்த்துக்கள்! ஜெய் பவானி, ஜெய் சிவாஜி! 🚩`,
      telugu: `చీకటిపై వెలుగు సాధించిన విజయాన్ని జరుపుకునే దీపావళి! 🪔\n\nఛత్రపతి శివాజీ మహారాజ్ స్వరాజ్య జ్యోతిని వెలిగించినట్లే, మీ హృదయంలో ధైర్యం, పట్టుదల, స్ఫూర్తి అనే దీపం ఎల్లప్పుడూ వెలుగుతూ ఉండాలి.\n\nఈ దీపావళి మీ జీవితంలో సుఖం, సంపద, విజయపు కాంతిని నింపాలి!\n\nదీపావళి శుభాకాంక్షలు! జై భవానీ, జై శివాజీ! 🚩`,
      punjabi: `ਹਨੇਰੇ ਉੱਤੇ ਰੌਸ਼ਨੀ ਦੀ ਜਿੱਤ ਦਾ ਤਿਉਹਾਰ, ਦੀਵਾਲੀ! 🪔\n\nਜਿਵੇਂ ਛਤਰਪਤੀ ਸ਼ਿਵਾਜੀ ਮਹਾਰਾਜ ਨੇ ਸਵਰਾਜ ਦੀ ਜੋਤ ਜਗਾਈ, ਉਸੇ ਤਰ੍ਹਾਂ ਤੁਹਾਡੇ ਮਨ ਵਿੱਚ ਹਿੰਮਤ, ਦ੍ਰਿੜ੍ਹਤਾ ਅਤੇ ਪ੍ਰੇਰਣਾ ਦਾ ਦੀਵਾ ਸਦਾ ਜਗਦਾ ਰਹੇ।\n\nਇਸ ਦੀਵਾਲੀ ਤੁਹਾਡੀ ਜ਼ਿੰਦਗੀ ਵਿੱਚ ਖੁਸ਼ੀਆਂ, ਖੁਸ਼ਹਾਲੀ ਅਤੇ ਸਫਲਤਾ ਦਾ ਪ੍ਰਕਾਸ਼ ਹੋਵੇ!\n\nਦੀਵਾਲੀ ਦੀਆਂ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ! ਜੈ ਭਵਾਨੀ, ਜੈ ਸ਼ਿਵਾਜੀ! 🚩`
    };

    function updateMessage() {
      const lang = document.getElementById('langSelect').value;
      document.getElementById('messageText').innerText = messages[lang];
    }
    updateMessage();

    function toggleModal(show) {
      document.getElementById('wishModal').style.display = show ? 'flex' : 'none';
    }

    function getShareText() {
      const lang = document.getElementById('langSelect').value;
      return `🪔 *Happy Diwali!* 🪔\n\n${messages[lang]}\n\n— *Wishes from Rushikesha & Family 🚩*\n\nCelebrate and play with interactive fireworks here:\n👉 ${window.location.href}`;
    }

    function shareWhatsApp() {
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(getShareText())}`, '_blank');
    }

    async function shareNative() {
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Diwali Wishes', text: getShareText(), url: window.location.href });
        } catch (e) {}
      } else {
        navigator.clipboard.writeText(getShareText());
        alert('Greeting copied to clipboard!');
      }
    }

    // Canvas Fireworks Simulation
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createFirework(x, y) {
      const colors = ['#ff0055', '#ff9900', '#ffd700', '#00ffcc', '#ff00ff', '#ffffff'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color: color,
          size: Math.random() * 3 + 2
        });
      }
    }

    // Tap/Click on canvas launches firework
    canvas.addEventListener('pointerdown', (e) => {
      createFirework(e.clientX, e.clientY);
    });

    // Light Diya function
    function lightDiya(el, event) {
      event.stopPropagation();
      el.classList.toggle('lit');
      const rect = el.getBoundingClientRect();
      createFirework(rect.left + rect.width / 2, rect.top);
      
      // If all are lit, trigger celebration popup
      const totalLit = document.querySelectorAll('.diya-btn.lit').length;
      if (totalLit === 5) {
        setTimeout(() => { toggleModal(true); }, 700);
      }
    }

    // Auto fireworks every 1.5 seconds
    setInterval(() => {
      createFirework(
        Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1),
        Math.random() * (canvas.height * 0.5) + (canvas.height * 0.1)
      );
    }, 1500);

    function renderLoop() {
      ctx.fillStyle = 'rgba(12, 2, 23, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05; // gravity
        p.alpha -= 0.015;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();
  </script>
</body>
</html>
